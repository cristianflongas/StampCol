<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="100%" height="100%" id="svg-tshirt-back">
  <defs>
    <filter id="tshirt-shadow-back" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Silueta Principal de la Camiseta / Buso (Espalda) -->
  <g id="tshirt-color-layer-back" fill="currentColor">
    <!-- Manga Izquierda -->
    <path d="M 195,115 L 75,210 C 65,218 60,230 65,245 L 95,285 C 105,295 120,295 130,285 L 175,235 L 175,200 Z" />

    <!-- Manga Derecha -->
    <path d="M 405,115 L 525,210 C 535,218 540,230 535,245 L 505,285 C 495,295 480,295 470,285 L 425,235 L 425,200 Z" />

    <!-- Torso Espalda Completo -->
    <path d="M 195,115 C 235,108 265,110 300,110 C 335,110 365,108 405,115 L 430,235 L 420,620 L 180,620 L 170,235 Z" />
  </g>

  <!-- Cuello Trasero Alto (Menos pronunciado que el delantero) -->
  <path d="M 230,110 C 265,120 335,120 370,110 C 355,104 245,104 230,110 Z" fill="none" stroke="#000000" stroke-width="6" opacity="0.18" />
  <path d="M 230,110 C 265,120 335,120 370,110 C 355,106 245,106 230,110 Z" fill="none" stroke="currentColor" stroke-width="5" opacity="0.95" />

  <!-- Costuras y sombras de la espalda -->
  <g fill="none" stroke="#000000" stroke-width="1.8" opacity="0.2">
    <!-- Costura del cuello trasero -->
    <path d="M 230,112 C 265,124 335,124 370,112" stroke-dasharray="3 2" />

    <!-- Costuras hombros y sisas -->
    <path d="M 195,115 L 172,215" />
    <path d="M 405,115 L 428,215" />

    <!-- Dobladillos mangas -->
    <line x1="68" y1="242" x2="128" y2="282" stroke-dasharray="3 2" />
    <line x1="532" y1="242" x2="472" y2="282" stroke-dasharray="3 2" />

    <!-- Dobladillo inferior -->
    <line x1="180" y1="605" x2="420" y2="605" stroke-dasharray="3 2" />

    <!-- Pliegues leves de caída -->
    <path d="M 190,290 C 205,320 200,370 190,420" stroke-linecap="round" />
    <path d="M 410,290 C 395,320 400,370 410,420" stroke-linecap="round" />
  </g>
</svg>
